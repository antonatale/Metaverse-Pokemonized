# Every push and pull request: typecheck, unit tests with the golden files, and the single-file build,
# on Linux with Node 22. The Playwright games are not here yet: they run on the Mac (npm run test:e2e).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests and golden files
        run: npm test
      - name: Build the single file
        run: npx vite build
      - name: Size of the single file
        run: ls -l dist/index.html
