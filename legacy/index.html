<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lotte tra Amici</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&family=Patrick+Hand&display=swap">
<style>
/* Layout: one notebook column. The home page scrolls like a page of a squared exercise book:
   story card, roster, the chosen friend's card, the boss, the type cycle, the record.
   The battle fills exactly one screen: arena, dialogue strip, 2x2 move pad.
   The story map fills the screen too: canvas underneath, place and pins on top, dialogue above
   the touch pad (the pad hides where there is a mouse and a keyboard). */
:root {
  --paper: #f7f6f0;      /* quaderno a quadretti */
  --grid: #d5dfee;
  --margin: #e8877c;
  --ink: #1f2c6e;        /* biro blu */
  --text: #1b1f2e;
  --muted: #5a6276;
  --card: #ffffff;
  --line: #1f2c6e;
  --track: #e4e7ef;
  --red: #c8372d;        /* penna rossa */
  --good: #2c9a55;
  --warn: #d99a12;
  --on-hl: #1b1f2e;
  --shadow: rgba(31, 44, 110, .18);
  --btn: #c8372d;
  --on-btn: #ffffff;
  --t-calma: #8fd0f6;    /* evidenziatori */
  --t-caos: #ffa35a;
  --t-cervello: #bba0ff;
  --t-chiacchiera: #ffe45c;
  --t-cuore: #ff8fc1;
  --t-none: #dde1ea;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-hand: "Patrick Hand", "Chalkboard SE", "Comic Sans MS", cursive;
  /* the city maps: ballpoint on squared paper, coloured with highlighters */
  --m-paper: #f7f6f0; --m-grid: #d5dfee; --m-ink: #1f2c6e; --m-label: #1b1f2e; --m-shadow: rgba(31, 44, 110, .16);
  --m-grass: #cdeab4; --m-grass2: #9fcf86; --m-path: #f1e6cc; --m-path2: #d8c6a0; --m-road: #dde0e8; --m-road2: #b9bfcc;
  --m-sand: #f8e9b0; --m-sand2: #e2c97a; --m-sea: #a7d8f2; --m-sea2: #79bde6; --m-foam: #ffffff;
  --m-wood: #d9a874; --m-wood2: #b58552; --m-stone: #e4dfd2; --m-stone2: #c4bca9; --m-wall: #fffaf0; --m-clay: #e8916a; --m-line: #ffffff;
  --m-roof-a: #ff9a8b; --m-roof-b: #9ec5ff; --m-roof-c: #ffd166; --m-roof-d: #c3a6ff;
  --m-leaf: #86cf7f; --m-leaf2: #5aa860; --m-trunk: #b98a5e; --m-hedge: #77c07a; --m-flower-a: #ff8fc1; --m-flower-b: #ffd166;
  --m-hill: #bcd8a0; --m-hill2: #93ba7c; --m-rock: #ddd6c8; --m-rock2: #b2a893; --m-olive: #aec69c; --m-track: #ea8f72; --m-far: #d6deee; --m-far2: #b0bed9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1e2a26; --grid: #2b3934; --margin: #9c4f48; --ink: #e9efe7; --text: #eef2ec; --muted: #a9b5ae;
    --card: #26332f; --line: #dbe4dc; --track: #36443f; --red: #ff7d70; --good: #4cc27a; --warn: #f0b93a;
    --on-hl: #1b1f2e; --shadow: rgba(0, 0, 0, .45); --btn: #d24638; --on-btn: #ffffff;
    --t-calma: #7cc3ea; --t-caos: #f6964d; --t-cervello: #ad92f6; --t-chiacchiera: #f2d64f; --t-cuore: #f285b6; --t-none: #c9d0cc;
    --m-paper: #1e2a26; --m-grid: #2b3934; --m-ink: #dbe4dc; --m-label: #1b1f2e; --m-shadow: rgba(0, 0, 0, .3);
    --m-grass: #2f4a36; --m-grass2: #46694f; --m-path: #4a463d; --m-path2: #6a6455; --m-road: #3a3f47; --m-road2: #555c68;
    --m-sand: #5c5640; --m-sand2: #7c7350; --m-sea: #22465c; --m-sea2: #2f6280; --m-foam: #a9c9d8;
    --m-wood: #6e5238; --m-wood2: #8a6a48; --m-stone: #4e4b45; --m-stone2: #6b675e; --m-wall: #6a6459; --m-clay: #a85f44; --m-line: #e9efe7;
    --m-roof-a: #b8665c; --m-roof-b: #5b78a8; --m-roof-c: #b39445; --m-roof-d: #7f6aad;
    --m-leaf: #4f8a56; --m-leaf2: #3c6e43; --m-trunk: #7a5a3c; --m-hedge: #43734a; --m-flower-a: #d0739c; --m-flower-b: #c9a74f;
    --m-hill: #2d4733; --m-hill2: #436349; --m-rock: #5a564c; --m-rock2: #7a7363; --m-olive: #5c7457; --m-track: #9a5442; --m-far: #2e3c50; --m-far2: #44566f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1e2a26; --grid: #2b3934; --margin: #9c4f48; --ink: #e9efe7; --text: #eef2ec; --muted: #a9b5ae;
  --card: #26332f; --line: #dbe4dc; --track: #36443f; --red: #ff7d70; --good: #4cc27a; --warn: #f0b93a;
  --on-hl: #1b1f2e; --shadow: rgba(0, 0, 0, .45); --btn: #d24638; --on-btn: #ffffff;
  --t-calma: #7cc3ea; --t-caos: #f6964d; --t-cervello: #ad92f6; --t-chiacchiera: #f2d64f; --t-cuore: #f285b6; --t-none: #c9d0cc;
  --m-paper: #1e2a26; --m-grid: #2b3934; --m-ink: #dbe4dc; --m-label: #1b1f2e; --m-shadow: rgba(0, 0, 0, .3);
  --m-grass: #2f4a36; --m-grass2: #46694f; --m-path: #4a463d; --m-path2: #6a6455; --m-road: #3a3f47; --m-road2: #555c68;
  --m-sand: #5c5640; --m-sand2: #7c7350; --m-sea: #22465c; --m-sea2: #2f6280; --m-foam: #a9c9d8;
  --m-wood: #6e5238; --m-wood2: #8a6a48; --m-stone: #4e4b45; --m-stone2: #6b675e; --m-wall: #6a6459; --m-clay: #a85f44; --m-line: #e9efe7;
  --m-roof-a: #b8665c; --m-roof-b: #5b78a8; --m-roof-c: #b39445; --m-roof-d: #7f6aad;
  --m-leaf: #4f8a56; --m-leaf2: #3c6e43; --m-trunk: #7a5a3c; --m-hedge: #43734a; --m-flower-a: #d0739c; --m-flower-b: #c9a74f;
    --m-hill: #2d4733; --m-hill2: #436349; --m-rock: #5a564c; --m-rock2: #7a7363; --m-olive: #5c7457; --m-track: #9a5442; --m-far: #2e3c50; --m-far2: #44566f;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text);
  font: 16px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
body.in-battle { overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.spr { display: block; width: 100%; height: auto; }

/* ---------- shared bits ---------- */
.type {
  display: inline-block; padding: 1px 8px 0; border-radius: 3px;
  font: 13px/1.5 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--on-hl);
  background: var(--t-none);
}
.t-calma { background: var(--t-calma); } .t-caos { background: var(--t-caos); } .t-cervello { background: var(--t-cervello); }
.t-chiacchiera { background: var(--t-chiacchiera); } .t-cuore { background: var(--t-cuore); }
.hl { background: linear-gradient(104deg, transparent 2%, var(--t-cervello) 3%, var(--t-cervello) 97%, transparent 98%) 0 72% / 100% 42% no-repeat; padding: 0 .08em; }
.eyebrow { font: 13px/1.3 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- home ---------- */
#home { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 26px; }
.masthead h1 { margin: 4px 0 6px; font: 44px/1 var(--font-display); color: var(--ink); text-wrap: balance; }
.masthead p { margin: 0; max-width: 34ch; color: var(--muted); }
.sec-title { margin: 0 0 10px; font: 20px/1.2 var(--font-display); color: var(--ink); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title small { font: 13px/1.3 var(--font-body); color: var(--muted); }

.roster { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { border: 2px solid var(--line); border-radius: 8px; background: var(--card); padding: 4px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; cursor: pointer; text-align: center; }
.slot .face { width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 5px; overflow: hidden; background: var(--tc, var(--t-none)); }
.slot .nm { font: 15px/1.2 var(--font-display); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-top: 2px; }
.slot .nk { font: 12px/1.2 var(--font-body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.slot[aria-pressed="true"] { box-shadow: 3px 3px 0 var(--line); border-width: 3px; padding: 3px 3px 5px; }

.card { background: var(--card); border: 2px solid var(--line); border-radius: 10px; box-shadow: 4px 4px 0 var(--shadow); overflow: hidden; }
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); }
.hero-art { position: relative; background: var(--tc); background: linear-gradient(180deg, var(--tc), color-mix(in srgb, var(--tc) 55%, var(--card))); border-bottom: 2px solid var(--line); display: flex; justify-content: center; padding-top: 8px; }
.hero-art .spr { width: min(280px, 80%); }
.hero-id { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 12px 14px 0; }
.hero-id h2 { margin: 0; font: 34px/1 var(--font-display); color: var(--ink); }
.hero-id .from { flex-basis: 100%; font: 19px/1.25 var(--font-hand); color: var(--muted); }
.hero-id .nick { font: 15px/1.2 var(--font-display); color: var(--red); letter-spacing: .02em; }
.exprs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 10px 12px 12px; }
.expr { border: 1.5px solid var(--line); border-radius: 6px; background: var(--paper); padding: 0; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.expr .spr { background: var(--tc); background: color-mix(in srgb, var(--tc) 45%, var(--card)); }
.expr span { display: block; font: 11px/1.15 var(--font-body); color: var(--muted); padding: 3px 2px 4px; text-align: center; min-height: 2.3em; }
.expr[aria-pressed="true"] { box-shadow: 2px 2px 0 var(--line); border-width: 2px; }
.expr[aria-pressed="true"] span { color: var(--ink); font-weight: 700; }
.exprs-cap { margin: 0; padding: 0 12px 12px; font-size: 13px; color: var(--muted); }

.block { padding: 14px 14px 16px; border-top: 1.5px dashed var(--grid); display: flex; flex-direction: column; gap: 10px; }
.block h3 { margin: 0; font: 13px/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
.stats { display: grid; grid-template-columns: auto minmax(0, 1fr) 3ch; gap: 6px 10px; align-items: center; font-size: 14px; }
.stats b { font-weight: 700; } .stats i { font-style: normal; font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.bar { height: 9px; border-radius: 5px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink); border-radius: 5px; }
.trait { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.trait b { font: 17px/1.25 var(--font-display); color: var(--ink); }
.trait p { margin: 0; font-size: 14.5px; color: var(--text); }
.trait .lbl { font: 12px/1.2 var(--font-body); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.moves-list { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.moves-list li { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; }
.moves-list .mh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.moves-list .mh b { font: 17px/1.2 var(--font-display); color: var(--ink); }
.moves-list p { margin: 0; font-size: 14.5px; }
.moves-list .item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.quotes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 0; }
.quotes div { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.quotes dt { font-size: 12.5px; color: var(--muted); }
.quotes dd { margin: 0; font: 19px/1.25 var(--font-hand); color: var(--ink); }

.foe { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 12px 14px; align-items: center; }
.foe .btn { margin-top: 10px; }
.matchups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; font-size: 14px; }
.matchups div { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.matchups b { font-weight: 700; }
.foe b { font: 20px/1.15 var(--font-display); color: var(--ink); }
.foe p { margin: 4px 0 0; font-size: 14px; }

.cycle { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
.cycle .arr { font: 12px/1 var(--font-body); color: var(--muted); padding: 0 2px; }
.cycle-note { margin: 8px 0 0; font-size: 14px; color: var(--muted); max-width: 52ch; }
.cycle-why { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.cycle-why li { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.cycle-why .who { color: var(--muted); }

.libretto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 14px; gap: 8px; }
.rec { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.rec th { text-align: left; font: 12px/1.2 var(--font-body); font-weight: 700; color: var(--muted); padding: 8px 10px 4px; }
.rec td { padding: 6px 10px; border-top: 1px dashed var(--grid); }
.rec td + td, .rec th + th { text-align: right; }
.rec .empty { color: var(--muted); padding: 12px 10px; }
.libretto div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.libretto span { font-size: 12px; color: var(--muted); }
.libretto strong { font: 26px/1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }

.cta-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, var(--paper) 34%); }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 528px; margin: 0 auto; padding: 14px 16px; border: 2px solid var(--line); border-radius: 10px; background: var(--btn); color: var(--on-btn); font: 20px/1.1 var(--font-display); letter-spacing: .02em; box-shadow: 4px 4px 0 var(--line); cursor: pointer; }
.cta:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }

/* ---------- battle ---------- */
#battle { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px 6px; }
.tb-btn { border: 2px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 10px; font: 15px/1.2 var(--font-display); color: var(--ink); cursor: pointer; }
.clock { display: flex; align-items: center; gap: 6px; font: 15px/1.2 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }
.clock .ico { width: 17px; height: 17px; }
.clock .turn { font: 700 12.5px/1 var(--font-body); color: var(--muted); }
.clock.low { color: var(--red); }

.arena {
  position: relative; flex: 1 1 auto; min-height: 250px; overflow: hidden;
  border-block: 2px solid var(--line);
  background-color: var(--paper);
  background-image: linear-gradient(90deg, transparent 30px, var(--margin) 30px, var(--margin) 32px, transparent 32px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 18px 18px, 18px 18px;
}
.box { position: absolute; z-index: 3; background: var(--card); border: 2px solid var(--line); border-radius: 8px; padding: 6px 9px 7px; display: flex; flex-direction: column; gap: 4px; box-shadow: 3px 3px 0 var(--shadow); }
.box.opp { left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; width: min(56%, 250px); }
.box.me { right: max(10px, env(safe-area-inset-right, 0px)); bottom: 12px; width: min(55%, 250px); }
.box-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.box-h b { font: 17px/1.1 var(--font-display); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.box-f { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.box-f .type { font-size: 11px; padding: 0 6px; line-height: 1.6; }
.box-f .hpnum { margin-left: auto; }
.hp { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 6px; }
.hp em { font: 12px/1 var(--font-display); font-style: normal; color: var(--red); letter-spacing: .04em; }
.hpbar { height: 9px; border-radius: 5px; background: var(--track); border: 1.5px solid var(--line); overflow: hidden; }
.hpbar > span { display: block; height: 100%; width: 100%; background: var(--good); transition: width .55s cubic-bezier(.3, .7, .3, 1), background-color .3s; }
.hpbar.mid > span { background: var(--warn); } .hpbar.low > span { background: var(--red); }
.hpnum { font: 13px/1 var(--font-body); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; align-self: flex-end; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px 1px 4px; border-radius: 4px; border: 1.5px solid var(--line); font: 11.5px/1.35 var(--font-body); font-weight: 700; color: var(--on-hl); background: var(--t-none); white-space: nowrap; }
.chip .ico { width: 13px; height: 13px; stroke-width: 2; }
.chip.info { background: var(--t-chiacchiera); } .chip.white { background: #fff; color: #1b1f2e; } .chip.stage { background: var(--t-cuore); }
.chip.down { background: var(--t-caos); } .chip.bad { background: var(--red); color: #fff; border-color: var(--red); }
.chip.up { background: var(--t-calma); } .chip.tag { background: var(--line); color: var(--card); border-color: var(--line); }

.spr-wrap { position: absolute; z-index: 2; }
.spr-wrap.me { left: max(4px, env(safe-area-inset-left, 0px)); bottom: -6px; width: min(46%, 220px); }
.spr-wrap.opp { right: max(6px, env(safe-area-inset-right, 0px)); top: 14px; width: min(38%, 168px); }
.spr-wrap.opp::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -2px; height: 16px; border-radius: 50%; background: var(--shadow); z-index: -1; }
.bob { animation: bob 2.8s ease-in-out infinite; }
.opp .bob { animation-duration: 3.4s; animation-delay: -1.2s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.mover.lunge-me { animation: lungeMe .34s ease-out; }
.mover.lunge-opp { animation: lungeOpp .34s ease-out; }
.mover.shake { animation: shake .42s linear; }

      el.style.background = cols[k % cols.length];
      var ang = (i === 0 ? -1.1 : 2.0) + (Math.random() - 0.5) * 2.2, dist = 70 + Math.random() * 90;
      all.push(animate(el, [{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: 'translate(' + Math.cos(ang) * dist + 'px,' + (Math.sin(ang) * dist + 40) + 'px) rotate(' + (Math.random() * 720) + 'deg)', opacity: 0 }], { duration: 900 + Math.random() * 300, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' }).then((function (e) { return function () { e.remove(); }; })(el)));
    }
    return sleep(700);
  }
  function notes(i) {
    var all = [];
    for (var k = 0; k < 4; k++) {
      (function (k) {
        var p = anchor(i, 0.25 + k * 0.17, 0.12), el = fx(NOTE, 'note', p[0], p[1], 0);
        all.push(sleep(k * 120).then(function () {
          return animate(el, [{ transform: 'translateY(10px) scale(.5)', opacity: 0 }, { transform: 'translateY(-20px) scale(1)', opacity: 1, offset: 0.4 }, { transform: 'translate(' + (k % 2 ? 14 : -14) + 'px,-60px)', opacity: 0 }], { duration: 1000, easing: 'ease-out', fill: 'forwards' });
        }).then(function () { el.remove(); }));
      })(k);
    }
    return sleep(800);
  }
  function scan(i) {
    var w = $('w-' + i), line = document.createElement('div');
    line.className = 'scanline'; line.style.top = '0';
    w.appendChild(line);
    return animate(line, [{ top: '0%', opacity: 1 }, { top: '96%', opacity: 1 }, { top: '96%', opacity: 0 }], { duration: 850, easing: 'ease-in-out' })
      .then(function () { line.remove(); shown.revealed[i] = true; setHp(i, uiHp[i]); });
  }
  function banner(text, style) {
    var el = fx(esc(text), 'banner ' + (style || ''), 0, 0, 1300);
    el.style.left = ''; el.style.top = '';
    return sleep(1050);
  }

  /* ---------- playback ---------- */
  var flow = 0;
  var EX_MAP = { smirk: 'idle', grin: 'angry', cool: 'angry', pout: 'hurt', worried: 'hurt', sleepy: 'ko', ko: 'ko', idle: 'idle', angry: 'angry', hurt: 'hurt' };
  var PX_MAP = { idle: 'smirk', angry: 'grin', hurt: 'pout', ko: 'sleepy' };
  function setExpr(i, v) {
    var id = S.sides[i].id, svg = battle.querySelector('#w-' + i + ' .spr');
    if (!svg) return;
    if (id === 'esame') svg.setAttribute('data-face', EX_MAP[v] || 'idle');
    else svg.setAttribute('data-expr', PX_MAP[v] || v);
  }
  function hpEvent(ev) {
    var i = ev.who, m = $('m-' + i);
    uiHp[i] = ev.hp;
    if (ev.dmg) {
      m.classList.remove('shake', 'flash'); void m.offsetWidth; m.classList.add('shake', 'flash');
      var p = anchor(i, 0.5, i === 0 ? 0.18 : 0.12);
      fx('−' + ev.dmg, 'num ' + (ev.crit ? 'crit' : ''), p[0], p[1], 1150);
      setHp(i, ev.hp);
      return sleep(600).then(function () { m.classList.remove('shake', 'flash'); });
    }
    if (!ev.quiet) m.classList.add('glow');
    var q = anchor(i, 0.5, i === 0 ? 0.18 : 0.12);
    fx('+' + ev.heal, 'num heal', q[0], q[1], 1150);
    setHp(i, ev.hp);
    return sleep(ev.quiet ? 350 : 650).then(function () { m.classList.remove('glow'); });
  }
  function animEvent(ev) {
    var i = ev.who, j = 1 - i, m = $('m-' + i);
    switch (ev.a) {
      case 'lunge': return pulse(m, i === 0 ? 'lunge-me' : 'lunge-opp', 340);
      case 'dodge': return pulse(m, 'dodge', 400);
      case 'enter': return pulse(m, 'enter', 560);
      case 'faint': m.classList.add(i === 0 ? 'faint-me' : 'faint-opp'); return sleep(950);
      case 'heal': return Promise.resolve();
      case 'robot': return projectile(i, j, SPR.robot(), 'robot', 620);
      case 'robotFail': return robotFall(i);
      case 'robotFix': return robotFix();
      case 'lost': return popAt(i, '<div class="pop">' + ico(ev.item) + '<i>?</i></div>', '', 0.62, 0.02);
      case 'found': return popAt(i, '<div class="pop">' + ico(ev.item) + '<i>!</i></div>', '', 0.62, 0.02);
      case 'ai': return popAt(i, '<div class="pop">' + ico('spark') + '</div>', '', 0.68, 0.04, 900);
      case 'reveal': return scan(i);
      case 'banner': return banner(ev.text, ev.style);
      case 'speech': return popAt(i, '<div class="bubble">BLA BLA BLA</div>', '', 0.5, -0.02, 900);
      case 'glint': return pulse(m, 'flash', 420);
      case 'fox': return projectile(i, j, FOX, '', 560, 70);
      case 'pump': return pulse(m, 'glow', 800);
      case 'confetti': confetti(i); return pulse(m, i === 0 ? 'lunge-me' : 'lunge-opp', 340);
      case 'flyAway': m.classList.add('away'); return sleep(700).then(function () { m.classList.remove('away'); m.classList.add('gone'); });
      case 'flyBack': m.classList.remove('gone'); return pulse(m, 'back', 620);
      case 'glowGreen': return pulse(m, 'glowGreen', 1000);
      case 'ball': return projectile(i, j, BALL, '', 460, 24);
      case 'cryptic': return projectile(i, j, '<div class="bubble hand">ok… ?¿</div>', '', 700, 30);
      case 'bark': return popAt(i, '<div class="bubble">BAU!</div>', '', 0.55, 0, 800);
      case 'laugh': return popAt(i, '<div class="bubble">AHAHAH</div>', '', 0.5, 0, 900);
      case 'cricket': return popAt(i, '<div class="bubble hand">cri cri…</div>', '', 0.5, 0, 1000);
      case 'confused': return popAt(i, '<div class="pop">' + ico('swirl') + '</div>', '', 0.5, 0, 900);
      case 'phOn': case 'phOff':
        var svg = battle.querySelector('#w-' + i + ' .spr-p');
        if (svg) svg.setAttribute('data-ph', ev.a === 'phOn' ? 'on' : 'off');
        return pulse(m, 'glow', 500);
      case 'notes': notes(i); return sleep(300).then(function () { return pulse(m, i === 0 ? 'lunge-me' : 'lunge-opp', 340); });
      default: return Promise.resolve();
    }
  }
  function stepEvent(ev) {
    switch (ev.k) {
      case 'say': return say(ev.text);
      case 'line': return say(ev.text, ev.who);
      case 'expr': setExpr(ev.who, ev.v); return Promise.resolve();
      case 'anim': return animEvent(ev);
      case 'hp': return hpEvent(ev);
      case 'sync': renderSync(ev); return Promise.resolve();
      default: return Promise.resolve();
    }
  }
  function play(evs, my) {
    var n = 0;
    function next() {
      if (my !== flow) return Promise.reject(CANCEL);
      if (n >= evs.length) return Promise.resolve();
      return stepEvent(evs[n++]).then(next);
    }
    return next();
  }
  function caught(e) { if (e !== CANCEL) throw e; }
  function runFlow() {
    var my = ++flow;
    function loop() {
      if (my !== flow) return Promise.resolve();
      if (S.phase === 'over') { showResult(); return Promise.resolve(); }
      if (S.phase === 'intro') { setPad(false, 0); return play(E.intro(S), my).then(loop); }
      if (S.phase === 'begin') { setPad(false); turnbar.hidden = true; return play(E.beginTurn(S), my).then(loop); }
      if (S.phase === 'select') {
        renderSync(E.snap(S));
        pending = {}; needQ = E.needs(S);
        if (!needQ.length) { setPad(false); return sleep(250).then(function () { return resolveTurn(my); }).then(loop); }
        askNext(false);
      }
      return Promise.resolve();
    }
    return loop().catch(caught);
  }
  function askNext(handoff) {
    var i = needQ[0];
    if (handoff && S.mode === 'pvp') { setPad(false, i); showPass(i); return; }
    showPrompt(i);
    setPad(true, i);
  }
  function onMove(id) {
    if (!padOn || !S || S.phase !== 'select' || !needQ.length) return;
    var i = needQ[0];
    if (E.available(S, i).indexOf(id) < 0) return;
    pending[i] = id;
    needQ.shift();
    setPad(false, i);
    if (needQ.length) { askNext(true); return; }
    turnbar.hidden = true;
    var my = ++flow;
    resolveTurn(my).then(function () { if (my === flow) runFlow(); }).catch(caught);
  }
  function resolveTurn(my) { return play(E.playTurn(S, pending), my); }

  /* =================== PASS THE PHONE =================== */
  function showPass(i) {
    var id = S.sides[i].id;
    overlay.className = 'overlay pass';
    overlay.innerHTML = '<div class="pass-card" role="dialog" aria-modal="true" aria-labelledby="ps-t" style="--tc:' + tc(id) + '"><div class="face">' + face(id) + '</div>' +
      '<h2 id="ps-t">Passa il telefono al Giocatore ' + (i + 1) + '</h2><p>Tocca a ' + esc(C[id].name) + '. La mossa del Giocatore ' + (2 - i) + ' è già scelta e resta segreta.</p>' +
      '<button class="btn primary" type="button" id="ps-go">Sono il Giocatore ' + (i + 1) + '</button></div>';
    overlay.hidden = false;
    $('ps-go').addEventListener('click', function () { closeOverlay(); showPrompt(i); setPad(true, i); });
    setTimeout(function () { var b = $('ps-go'); if (b) b.focus(); }, 30);
  }

  /* =================== RESULT =================== */
  function bump(id, key) { var r = record.chars[id] || (record.chars[id] = { w: 0, l: 0 }); r[key]++; }
  function showResult() {
    var r = S.result, A = S.sides[0], B = S.sides[1];
    if (!S.recorded) {
      S.recorded = true;
      if (S.boss) {
        var x = record.exam[A.id] || (record.exam[A.id] = { p: 0, f: 0, best: null, lode: false });
        if (r === 'win' && S.winner === 0) {
          x.p++; bump(A.id, 'w');
          var g = S.grade, val = g.lode ? 31 : g.g, bestVal = x.best == null ? -1 : (x.lode ? 31 : x.best);
          if (val > bestVal) { x.best = g.g; x.lode = g.lode; }
        } else { x.f++; bump(A.id, 'l'); }
      } else if (r === 'win') { bump(S.sides[S.winner].id, 'w'); bump(S.sides[1 - S.winner].id, 'l'); }
      saveRecord(); renderLibretto();
    }
    var star, stamp, sub = '', first, second;
    if (S.boss) {
      star = A.id;
      stamp = r === 'win' && S.winner === 0 ? 'Superato' : r === 'time' ? 'Ritirato' : 'Bocciato';
      var won = r === 'win' && S.winner === 0;
      first = won ? [0, C[A.id].lines.win] : r === 'time' ? [1, C.esame.lines.time] : [0, C[A.id].lines.ko];
      second = won ? [1, C.esame.lines.ko] : r === 'time' ? (C[A.id].lines.time ? [0, C[A.id].lines.time] : null) : [1, C.esame.lines.win];
    } else if (r === 'win') {
      var w = S.sides[S.winner], l = S.sides[1 - S.winner];
      star = w.id;
      stamp = 'Vince ' + C[w.id].name;
      if (S.mode === 'pvp') sub = 'Giocatore ' + (S.winner + 1);
      else sub = S.winner === 0 ? 'Hai vinto' : 'Ha vinto il computer';
      first = [S.winner, C[w.id].lines.win]; second = [1 - S.winner, C[l.id].lines.ko];
    } else { star = A.id; stamp = 'Pareggio'; first = null; second = null; }
    var story = S.story, storyWon = !!story && r === 'win' && S.winner === 0;
    if (story && window.WORLD_COVI && window.WORLD_COVI[story.covo]) sub = window.WORLD_COVI[story.covo].name;
    var expr = r === 'win' ? (S.boss && S.winner === 1 ? 'sleepy' : 'cool') : 'worried';
    var gradeHtml = S.boss && S.grade ? '<div class="grade"><span>Voto</span><strong>' + (S.grade.lode ? '30 e lode' : S.grade.g + '/30') + '</strong></div>' : (sub ? '<div class="grade"><span>' + esc(sub) + '</span></div>' : '');
    var me = S.winner != null ? S.sides[S.winner].st : A.st;
    var h = '<div class="res" role="dialog" aria-modal="true" aria-labelledby="res-t" style="--tc:' + tc(star) + '">' +
      '<div class="res-art">' + bust(star, expr, '', '0 0 260 270') + '<div class="stamp" id="res-t">' + esc(stamp) + '</div>' + gradeHtml + '</div><div class="res-body">';
    [first, second].forEach(function (q) { if (q) h += '<p class="say"><small>' + esc(sideName(q[0])) + '</small>«' + esc(q[1]) + '»</p>'; });
    h += '<div class="res-stats"><div><span>Turni</span><strong>' + S.turn + '</strong></div><div><span>Danni</span><strong>' + me.dmg + '</strong></div><div><span>Critici</span><strong>' + me.crits + '</strong></div><div><span>Cure</span><strong>' + me.heals + '</strong></div></div>' +
      '<div class="res-actions">' + (story
        ? (storyWon ? '<button class="btn primary wide" type="button" id="st-go">Continua</button>'
          : '<button class="btn primary" type="button" id="st-retry">Riprova</button><button class="btn" type="button" id="st-go">Torna a ' + esc(storyCity(story)) + '</button>')
        : '<button class="btn primary" type="button" id="again">Rivincita</button><button class="btn" type="button" id="change">Cambia sfida</button><button class="btn wide" type="button" id="back">Torna ai personaggi</button>') +
      '</div></div></div>';
    overlay.className = 'overlay result';
    overlay.innerHTML = h;
    overlay.hidden = false;
    var cfg = { a: A.id, b: B.id, mode: S.mode, story: story, safe: S.safe };
    if (story) {
      $('st-go').addEventListener('click', function () { backToWorld(story, storyWon, false); });
      if ($('st-retry')) $('st-retry').addEventListener('click', function () { closeOverlay(); startBattle(cfg); });
      setTimeout(function () { var b = $('st-retry') || $('st-go'); if (b) b.focus(); }, 50);
      return;
    }
    $('again').addEventListener('click', function () { closeOverlay(); startBattle(cfg); });
    $('change').addEventListener('click', function () { goHome(); view.p1 = cfg.a; view.p2 = cfg.b; view.mode = cfg.mode; renderSetup(); });
    $('back').addEventListener('click', function () { closeOverlay(); goHome(); });
    setTimeout(function () { var b = $('again'); if (b) b.focus(); }, 50);
  }

  /* =================== IN-BATTLE SHEET =================== */
  function openSheet() {
    if (!S) return;
    var h = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-h"><h2 id="sh-t">Scheda della lotta</h2><button class="tb-btn" type="button" id="sh-x">Chiudi</button></div>';
    [0, 1].forEach(function (i) {
      var c = C[S.sides[i].id];
      h += '<div class="card" style="--tc:' + TC[c.type] + '"><div class="block"><h3>' + esc(sideLabel(i) + ' · ' + c.name) + '</h3>';
      if (c.id === 'esame' && !S.sides[i].revealed) h += '<p class="unknown">Statistiche e mosse ancora sconosciute. Antonio può analizzarlo con Diagnosi Energetica; con gli altri lo scopri giocando.</p></div>';
      else {
        var st = c.stats;
        h += '<div class="mini-stats"><div><span>Vita</span><strong>' + st.hp + '</strong></div><div><span>Attacco</span><strong>' + st.atk + '</strong></div><div><span>Difesa</span><strong>' + st.def + '</strong></div><div><span>Velocità</span><strong>' + st.spe + '</strong></div></div></div>' + charBlocks(c);
      }
      h += '</div>';
    });
    h += '<div class="card"><div class="block"><h3>Tipi</h3><ul class="cycle-why">';
    E.TYPE_ORDER.forEach(function (t) { h += '<li>' + typeTag(t) + '<span>batte ' + E.TYPES[t].beats + ': ' + E.TYPES[t].why + '.</span></li>'; });
    h += '</ul></div></div></div>';
    overlay.className = 'overlay';
    overlay.innerHTML = h;
    overlay.hidden = false;
    $('sh-x').addEventListener('click', closeOverlay);
    setTimeout(function () { var b = $('sh-x'); if (b) b.focus(); }, 30);
  }
  function closeOverlay() { overlay.hidden = true; overlay.innerHTML = ''; overlay.className = 'overlay'; }
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay && !overlay.classList.contains('result') && !overlay.classList.contains('pass')) closeOverlay();
  });

  /* =================== NAVIGATION =================== */
  function startBattle(cfg, restore) {
    if (!restore) {
      var seed = (Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0;
      S = E.newBattle({ a: cfg.a, b: cfg.b, mode: cfg.mode, seed: seed, safe: cfg.safe });
      S.story = cfg.story || null;
    }
    flow++;
    if (stopSay) stopSay();
    if (window.WORLD) window.WORLD.close();
    view.screen = 'battle';
    home.hidden = true; battle.hidden = false;
    document.body.classList.add('in-battle');
    window.scrollTo(0, 0);
    renderShell();
    uiHp = [S.sides[0].hp, S.sides[1].hp];
    shown.revealed = [true, S.mode === 'pvp' || S.sides[1].id !== 'esame' || S.sides[1].revealed];
    setHp(0, uiHp[0]); setHp(1, uiHp[1]);
    renderSync(E.snap(S));
    setPad(false, 0);
    runFlow();
  }
  function goHome() {
    flow++;
    if (stopSay) stopSay();
    tapHandler = null;
    view.screen = 'home';
    if (window.WORLD) window.WORLD.close();
    battle.hidden = true; battle.innerHTML = '';
    home.hidden = false;
    document.body.classList.remove('in-battle');
    closeOverlay();
    renderLibretto();
    renderStory();
  }
  /* a story battle is over (or abandoned): back to the map, where the covo reacts */
  function backToWorld(story, won, quit) {
    flow++;
    if (stopSay) stopSay();
    tapHandler = null;
    battle.hidden = true; battle.innerHTML = '';
    document.body.classList.remove('in-battle');
    closeOverlay();
    renderLibretto();
    S = null;
    if (window.WORLD) window.WORLD.afterBattle({ covo: story.covo, won: won, quit: !!quit });
    else goHome();
  }
  window.UI = {
    startBattle: startBattle, goHome: goHome, setScreen: function (s) { view.screen = s; },
    /* the computer's choice for the side that has to move, on a copy so the battle's dice stay untouched (playtests) */
    _debug: {
      suggest: function () { return S && S.phase === 'select' && needQ.length ? E.ai(JSON.parse(JSON.stringify(S)), needQ[0]) : null; },
      battle: function () { return S ? { a: S.sides[0].id, b: S.sides[1].id, story: S.story, safe: S.safe } : null; }
    }
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.hidden && !overlay.classList.contains('result') && !overlay.classList.contains('pass')) { closeOverlay(); return; }
    if (view.screen !== 'battle' || !overlay.hidden) return;
    if (e.key === ' ' || e.key === 'Enter') { if (tapHandler) { e.preventDefault(); advance(); } return; }
    if (/^[1-4]$/.test(e.key) && padOn) { var m = C[S.sides[padSide].id].moves[+e.key - 1]; if (m) onMove(m.id); }
  });

  /* =================== BOOT (keeps an open battle across updates) =================== */
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) {
    hot.snapshot(function () {
      return { v: 2, view: view, battle: view.screen === 'battle' && S && S.phase !== 'over' ? JSON.parse(JSON.stringify(S)) : null };
    });
  }
  function start(data) {
    data = data || {};
    if (data.v === 2 && data.view) {
      ['sel', 'hero', 'mode', 'p1', 'p2'].forEach(function (k) { if (data.view[k]) view[k] = data.view[k]; });
      if (ROSTER.indexOf(view.sel) < 0) view.sel = 'antonio';
    }
    SPR.install();
    renderHome();
    if (data.v === 2 && data.view && data.view.screen === 'battle' && data.battle && data.battle.v === 2) {
      S = data.battle;
      if (S.phase === 'busy') S.phase = 'begin';
      startBattle(null, true);
    } else if (data.v === 2 && data.view && data.view.screen === 'world' && window.WORLD) window.WORLD.open(true);
  }
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();

</script>
